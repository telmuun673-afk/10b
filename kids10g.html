<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10Б анги</title>
<meta name="theme-color" content="#f3f6fc">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6fc; --card:#ffffff; --card2:#eef2fa; --line:#e1e7f3;
  --text:#14203b; --muted:#6b7691; --accent:#2563eb; --accent2:#06b6d4; --onacc:#fff;
  --danger:#ef4444; --warn:#f59e0b; --radius:18px; --shadow:0 2px 10px rgba(26,42,80,.08);
}
html[data-t=green]{--accent:#16a34a;--accent2:#65a30d}
html[data-t=orange]{--accent:#ea580c;--accent2:#f59e0b}
html[data-t=red]{--accent:#e11d48;--accent2:#f97316}
html[data-m=dark]{--bg:#05070c;--card:#0e1320;--card2:#171f33;--line:#222c45;--text:#e8ecf5;--muted:#93a0bc;--accent:#3da5ff;--accent2:#1de9b6;--onacc:#06101c;--shadow:none}
html[data-m=dark][data-t=green]{--accent:#2ee59d;--accent2:#b6f23a}
html[data-m=dark][data-t=orange]{--accent:#ff9a3d;--accent2:#ffd23d}
html[data-m=dark][data-t=red]{--accent:#ff5d73;--accent2:#ff9a5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:84px}
h1,h2,h3{margin:0 0 .5rem}
h2{font-size:1.2rem}
h3{font-size:1rem;color:var(--muted);font-weight:600}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.9rem}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;margin-bottom:8px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--onacc);font-weight:600;cursor:pointer}
button.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger);color:#fff}
button.small{padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.auto{flex:0 0 auto}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.topbar b{font-size:1.1rem}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1 0 auto;min-width:64px;background:transparent;color:var(--muted);border-radius:0;padding:10px 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:1.25rem}
.nav button.on{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 14px}
.tabs button.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.hw{display:flex;gap:12px;align-items:flex-start}
.hw.done{opacity:.6}
.hw input[type=checkbox]{width:26px;height:26px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent2)}
.hw .body{flex:1;min-width:0}
.hw .subj{font-weight:700}
.pre{white-space:pre-wrap;word-wrap:break-word}
.hw img,.msg img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.msg .who{font-size:.75rem;opacity:.75;margin-bottom:2px}
.msg .t{font-size:.7rem;opacity:.6;margin-top:2px}
.composer{position:sticky;bottom:72px;background:var(--bg);padding:8px 0}
.period{display:flex;gap:12px;align-items:center}
.period .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login h1{font-size:2rem}
.err{color:var(--danger);min-height:1.4em;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;z-index:50}
.hide{display:none!important}
.actions{display:flex;gap:6px;margin-top:8px}
.hero2{border-radius:22px;padding:22px 20px;position:relative;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hero2:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero2:before{content:"";position:absolute;right:50px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero2 small{opacity:.85;font-size:.8rem}
.hero2 h1{margin:4px 0 6px;font-size:2.1rem;letter-spacing:-.5px;font-style:italic}
.hero2 p{margin:0;font-size:.9rem;opacity:.9}
.date{position:absolute;right:14px;top:14px;color:#fff;background:rgba(0,0,0,.28);padding:6px 11px;border-radius:99px;font-size:.75rem;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.stat span{font-size:.7rem;color:var(--muted);display:block}
.stat b{font-size:1.4rem;display:block;margin-top:4px}
.stat i{font-style:normal;font-size:.7rem;color:var(--accent2)}
.cardh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.cardh a{font-size:.75rem;color:var(--accent);font-weight:500}
.duty{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:var(--card2);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.person.me{outline:2px solid var(--accent2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--onacc);background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto}
.person b{font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small{color:var(--muted);font-size:.7rem}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--muted);background:var(--card2);border-radius:12px;padding:8px 2px}
.week div.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc);font-weight:700}
.week div em{display:block;font-style:normal;font-size:.62rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.plant{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.glass{height:140px;border-radius:64px 64px 16px 16px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pct{font-size:1.9rem;font-weight:800}
.bar{height:10px;border-radius:9px;background:var(--card2);overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rank.first{border-top:0}
.rank .n{width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:0 0 auto}
.rank.g1 .n{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc)}
.rank .nm{flex:1;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank.me .nm{color:var(--accent2);font-weight:700}
.rank .mini{width:60px;height:7px;border-radius:5px;background:var(--card2);overflow:hidden;flex:0 0 auto}
.rank .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rank .lv{font-size:.75rem;color:var(--muted);width:42px;text-align:right}
.hwr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hwr.first{border-top:0}
.hwr .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;background:var(--card2)}
.hwr b{font-size:.9rem;display:block}.hwr small{color:var(--muted);font-size:.78rem}
.chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem;flex:0 0 auto}
.chk.on{background:var(--accent2);border-color:var(--accent2);color:var(--onacc)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 4px;text-align:center;font-size:.75rem;color:var(--text);font-weight:500;display:block}
.tile u{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;margin:0 auto 6px;font-size:1.4rem;text-decoration:none;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),color-mix(in srgb,var(--accent2) 60%,#000))}
.slogan{color:var(--text);border-radius:18px;padding:16px;text-align:center;font-style:italic;font-weight:700;margin-bottom:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent2) 18%,var(--card)))}
.dots{display:flex;gap:12px;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.dot.on{border-color:#fff}
.nav button{position:relative}
.nav .bdg{position:absolute;top:4px;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:99px;font-size:.62rem;min-width:16px;height:16px;line-height:16px;padding:0 4px}

.pill.pin{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:700}
.pill.hid{background:var(--danger);color:#fff;border-color:var(--danger)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;position:relative}
.rx{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.85rem;font-weight:500}
.rx.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card2))}
.rx.add{color:var(--muted)}
.picker{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 6px;width:100%;max-width:290px;justify-content:space-around}
.picker button{background:transparent;padding:2px 6px;font-size:1.3rem;color:inherit}
.cmts{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cmt{padding:6px 0}
.cmt.n1{margin-left:16px;border-left:2px solid var(--line);padding-left:10px}
.cmt.n2,.cmt.n3{margin-left:12px;border-left:2px solid var(--line);padding-left:10px}
.cmt .who{font-weight:700;font-size:.85rem}.cmt .t{color:var(--muted);font-size:.72rem}
.mini{display:inline-block;background:none;color:var(--muted);padding:2px 6px;font-size:.78rem;font-weight:500}
.banner{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:.82rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.quote{border-left:3px solid var(--accent2);padding:2px 8px;margin-bottom:4px;font-size:.78rem;opacity:.8;background:rgba(255,255,255,.06);border-radius:4px}
.fileln{display:inline-block;margin-top:6px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:8px;font-size:.85rem}
.bell{position:relative;background:transparent;font-size:1.3rem;padding:4px 8px;color:var(--text)}
.bell i{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.62rem;font-style:normal;border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center}
.nt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.nt:first-child{border-top:0}
.nt.unread b{color:var(--accent2)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:26px;height:26px;margin:0;accent-color:var(--accent2)}
.mystar{color:var(--accent2)}
.crown{font-size:1rem}
.gift{position:fixed;inset:0;z-index:100;background:rgba(3,6,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.giftbox{font-size:120px;line-height:1;cursor:pointer;animation:wig 1.2s ease-in-out infinite;filter:drop-shadow(0 0 28px var(--accent))}
@keyframes wig{0%,100%{transform:rotate(-6deg) scale(1)}25%{transform:rotate(7deg) scale(1.08)}50%{transform:rotate(-4deg) scale(1)}75%{transform:rotate(5deg) scale(1.1)}}
.gift h2{font-size:1.5rem;margin:14px 0 6px}
.gift .tapme{color:var(--muted)}
.gmsg{font-size:1.5rem;font-weight:800;line-height:1.3;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.spark{position:absolute;left:50%;top:42%;pointer-events:none;font-size:22px;transition:transform 1.4s cubic-bezier(.1,.8,.3,1),opacity 1.4s;opacity:1}
.mdl{font-size:.8rem}

/* ===== шинэ: avatar, асуулт, дэлгүүр, өрөө ===== */
.avt{position:relative;display:inline-block;flex:0 0 auto;text-align:center;line-height:1}
.avt .b{display:block}
.avt .h{position:absolute;left:50%;top:-34%;transform:translateX(-50%);font-size:.62em;line-height:1}
.avt .g{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:.52em;line-height:1}
.avt .o{position:absolute;right:-12%;bottom:-6%;font-size:.5em;line-height:1}
.avt .hd{position:absolute;left:-16%;bottom:-4%;font-size:.5em;line-height:1}
.coin{font-weight:800}
.wall_mint{background:linear-gradient(#d1fae5,#a7f3d0)}
.wall_night{background:linear-gradient(#0f172a,#1e3a8a)}
.wall_sea{background:linear-gradient(#bae6fd,#38bdf8 70%,#0ea5e9)}
.wall_cloud{background:linear-gradient(#e0f2fe,#fff)}
.wall_gold{background:linear-gradient(#fef3c7,#f59e0b)}
.flr_wood{background:linear-gradient(#d9b98a,#c9a273)}
.flr_grass{background:linear-gradient(#86efac,#4ade80)}
.flr_blue{background:linear-gradient(#93c5fd,#60a5fa)}
.flr_check{background:repeating-conic-gradient(#e5e7eb 0 25%,#9ca3af 0 50%) 0 0/36px 36px}
.flr_sand{background:linear-gradient(#fde68a,#fcd34d)}
.flr_red{background:linear-gradient(#fca5a5,#ef4444)}
.it2.fl{animation:flo 3s ease-in-out infinite}
.wall_v_aurora{background:linear-gradient(#0b1026,#0f766e 55%,#7c3aed)}
.wall_v_royal{background:linear-gradient(#7f1d1d,#b45309 60%,#fbbf24)}
.wall_beach{background:linear-gradient(#7dd3fc,#bae6fd 55%,#fde68a)}
.flr_v_marble{background:linear-gradient(135deg,#f8fafc,#cbd5e1 50%,#f1f5f9)}
.flr_carpet{background:repeating-linear-gradient(90deg,#b91c1c 0 14px,#991b1b 14px 28px)}
.flr_snow{background:linear-gradient(#f8fafc,#dbeafe)}
.avt2{border-radius:50%;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--accent2) 22%,var(--card2)),var(--card2));vertical-align:middle}
.avt2 svg{display:block;margin:0 auto}
.room{height:auto!important;aspect-ratio:430/300;position:relative;overflow:hidden;border-radius:22px}
.it2.sel,.shopgrid .it.sel{outline:3px dashed var(--accent);outline-offset:2px;border-radius:10px}
.vb{position:absolute;right:-3px;bottom:-3px;line-height:1}
.vb2{display:block;font-size:.65rem;color:#7c3aed;font-weight:800}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.it2.fl{animation:none}}
.strk{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;z-index:1}
.qhero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);margin-bottom:12px}
.qhero small{opacity:.9}.qhero h2{font-size:1.15rem;margin:6px 0 0;line-height:1.35}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;font-weight:600}
.opt.ok{border-color:#22c55e;background:rgba(34,197,94,.12)}
.opt.bad{border-color:var(--danger);background:rgba(239,68,68,.1)}
.opt.sel{border-color:var(--accent)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.it{background:var(--card2);border:2px solid transparent;border-radius:16px;padding:10px 4px;text-align:center;font-size:.72rem;color:var(--text);font-weight:600;display:block;width:100%}
.it b{display:block;font-size:2rem;font-weight:400;margin-bottom:2px}
.it.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.it span{display:block;color:var(--warn);font-weight:800;margin-top:2px}
.it span.own{color:var(--accent)}
.room{height:300px;border-radius:22px;position:relative;overflow:hidden}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:46%;box-shadow:inset 0 6px 10px rgba(0,0,0,.12)}
.room .it2{position:absolute;font-size:1.85rem;line-height:1}
.wall_sky{background:linear-gradient(#bfe3ff,#e8f5ff)}
.wall_sunset{background:linear-gradient(#ffb199,#ff7e5f 55%,#feb47b)}
.wall_space{background:linear-gradient(#0b1026,#2a1b5c)}
.wall_forest{background:linear-gradient(#b7e4c7,#74c69d)}
.big{font-size:2rem}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.rowbtn{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rowbtn>*{flex:0 0 auto}
</style>
</head>

async function uploadFile(file,maxMB){
  if(file.size>(maxMB||10)*1024*1024) throw new Error("Файл "+(maxMB||10)+"MB-аас том байна");
  var ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8)||"bin";
  var path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  var r=await sb.storage.from("uploads").upload(path,file,{contentType:file.type||undefined});
  if(r.error) throw r.error;
  return sb.storage.from("uploads").getPublicUrl(path).data.publicUrl;
}

async function doLogin(){
  var code=$("code").value.trim();

  $("lbtn").disabled=true;
  var r=await sb.rpc("login",{p_code:code});

}

function b64u(s){ var p="=".repeat((4-s.length%4)%4), b=(s+p).replace(/-/g,"+").replace(/_/g,"/"), r=atob(b), o=new Uint8Array(r.length); for(var i=0;i<r.length;i++)o[i]=r.charCodeAt(i); return o; }

async function syncPush(ask){
  try{
    if(!S.code || !("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) return false;
    if(Notification.permission==="default" && ask) await Notification.requestPermission();
    if(Notification.permission!=="granted") return false;
    var reg=await navigator.serviceWorker.ready;
    var sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(VAPID_PUBLIC)});
    var j=sub.toJSON();
    await sb.rpc("save_push_sub",{p_code:S.code,p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_prefs:S.prefs});
    return true;
  }catch(e){ return false; }
}
function notify(title,body){
  toast(title+(body?": "+body:""));
  try{
    if(document.visibilityState!=="visible" && "Notification" in window && Notification.permission==="granted" && navigator.serviceWorker){
      navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.showNotification(title,{body:body||"",icon:"icon-192.png",badge:"icon-192.png"}); });
    }
  }catch(e){}
}
var refT=null;
function refreshSoon(){
  clearTimeout(refT);
  refT=setTimeout(async function(){
    var old=await loadAll();
    var lastN=Number(lsGet("nseen")||0);
    S.notifs.filter(function(n){return Number(n.id)>lastN;}).forEach(function(n){ if(S.prefs[n.kind]!==false) notify(n.title,n.body); });
    lsSet("nseen",String(maxId(S.notifs)));
    softRender();
  },700);
}
function softRender(){
  var busy=false; Array.prototype.forEach.call(document.querySelectorAll("input[type=file]"),function(f){ if(f.files&&f.files.length) busy=true; });
  if(busy||!S.user) return;
  render(true);
}
function subscribe(){
  if(S.chan) return;
  S.chan=sb.channel("live")
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},function(p){
     if(p.new && p.new.student_name!==S.user.name && S.prefs.chat) notify("💬 "+p.new.student_name,(p.new.body||"📎 хавсралт").slice(0,80));
     refreshSoon();
   })
   .on("postgres_changes",{event:"*",schema:"public",table:"messages"},function(){ refreshSoon(); })
   .on("postgres_changes",{event:"*",schema:"public",table:"announcements"},function(){ refreshSoon(); })
   .on("postgres_changes",{event:"*",schema:"public",table:"comments"},function(){ refreshSoon(); })
   .on("postgres_changes",{event:"*",schema:"public",table:"reactions"},function(){ refreshSoon(); })
   .on("postgres_changes",{event:"INSERT",schema:"public",table:"homework"},function(p){
     if(S.prefs.ann) notify("📚 Шинэ даалгавар",p.new?(p.new.day+" · "+p.new.subject):""); refreshSoon(); })
   .on("postgres_changes",{event:"*",schema:"public",table:"duty_overrides"},function(){ refreshSoon(); })
   .subscribe();
}

  var all=S.comments.filter(function(c){return Number(c.ann_id)===Number(a.id);});

async function adminSave(){
  var kind=S.adminKind, e=S.edit&&S.edit.row?S.edit.row:null, row={}, info=$("ainfo"), btn=$("asave");
  function v(id){ var el=$(id); return el?el.value.trim():""; }
  btn.disabled=true; info.textContent="Хадгалж байна…";
  try{
    if(kind==="homework"){
      if(!v("f_subject")) throw new Error("Хичээлийн нэр оруулна уу");
      row={day:v("f_day"),subject:v("f_subject"),description:v("f_description")||null,image_url:e?e.image_url:null,file_url:e?e.file_url:null};
      var im=$("f_img").files[0], fl=$("f_file").files[0];
      if(im){ info.textContent="Зураг оруулж байна…"; row.image_url=await uploadFile(im,8); }
      if(fl){ info.textContent="Файл оруулж байна…"; row.file_url=await uploadFile(fl,10); }
    } else if(kind==="schedule"){
      if(!v("f_subject")||!v("f_period")) throw new Error("Цаг болон хичээлийн нэр оруулна уу");
      row={day:v("f_day"),period:v("f_period"),subject:v("f_subject"),time:v("f_time")||null};
    } else {
      if(!v("f_title")) throw new Error("Гарчиг оруулна уу");
      row={kind:v("f_kind"),title:v("f_title"),subject:v("f_subject")||null,url:v("f_url")||(e?e.url:null)};
      var f2=$("f_file").files[0];
      if(f2){ info.textContent="Файл оруулж байна…"; row.url=await uploadFile(f2,10); }
    }
    if(e) row.id=String(e.id);
    var r=await sb.rpc("admin_save",{p_code:S.code,p_table:kind,p_row:row});
    if(r.error) throw r.error;
    toast("Хадгаллаа ✔"); S.edit=null; S.fields={}; await loadAll(); render();
  }catch(err){ info.textContent="Алдаа: "+(err.message||err); btn.disabled=false; }
}
async function adminDelete(kind,id){
  if(!confirm("Үнэхээр устгах уу?")) return;
  var r=await sb.rpc("admin_delete",{p_code:S.code,p_table:kind,p_id:Number(id)});
  if(r.error){ toast("Алдаа: "+r.error.message); return; }
  toast("Устгалаа"); await loadAll(); render(true);
}
async function rpcDo(name,args,okMsg){
  var r=await sb.rpc(name,args);
  if(r.error){ var em=r.error.message||"", MAP={"not enough coins":"Оноо хүрэлцэхгүй","bid too low":"Санал хэтэрхий бага","auction closed":"Дуудлага дууссан","already top":"Та аль хэдийн тэргүүлж байна","why needed":"Шалтгаанаа бичнэ үү","reason needed":"Шалтгаанаа бичнэ үү","daily limit":"Өдөрт 5 асуулт хүртэл","room locked":"Өрөө түгжээтэй байна","bad question":"Бүх талбарыг бөглөнө үү"}; Object.keys(MAP).forEach(function(k){ if(em.indexOf(k)>=0) em=MAP[k]; }); toast("Алдаа: "+em); return null; }
  if(okMsg) toast(okMsg);
  return r;
}

function checkGift(){
  if(S.tab!=="home"||$("gift")) return;
  var td=ubToday(), r=dutyRow(td);
  if(iAmOn(r) && lsGet("gift10b")!==td) showGift(td);
}
function showGift(td){
  var o=document.createElement("div"); o.className="gift"; o.id="gift";
  o.innerHTML='<div class="giftbox" id="gbox">🎁</div><h2>Танд бэлэг ирлээ!</h2><div class="tapme">Бэлэг дээр дараарай ✨</div>';
  document.body.appendChild(o);
  var opened=false;
  function burst(){
    var cols=["⭐","✨","🌟","💫","🎉","🎊","💖","🔥"];
    for(var i=0;i<46;i++){ (function(){
      var s=document.createElement("span"); s.className="spark"; s.textContent=cols[Math.floor(Math.random()*cols.length)];
      s.style.fontSize=(16+Math.random()*26)+"px"; o.appendChild(s);
      var ang=Math.random()*Math.PI*2, dist=120+Math.random()*(Math.min(window.innerWidth,window.innerHeight)*0.55);
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        s.style.transform="translate("+Math.cos(ang)*dist+"px,"+Math.sin(ang)*dist+"px) rotate("+(Math.random()*720-360)+"deg) scale("+(0.6+Math.random())+")"; s.style.opacity="0"; }); });
      setTimeout(function(){ s.remove(); },1600);
    })(); }
  }
  $("gbox").onclick=function(){
    if(opened) return; opened=true; lsSet("gift10b",td); sb.rpc("claim_gift",{p_code:S.code}).then(function(r){ if(r&&r.data){ toast("🪙 +20 оноо бэлэглэлээ!"); loadAll().then(function(){ if(S.tab==="home") render(true); }); } });
    burst(); setTimeout(burst,350);
    o.innerHTML='';
    var g=document.createElement("div"); g.className="giftbox"; g.style.animation="none"; g.textContent="🎉"; o.appendChild(g);
    var m=document.createElement("div"); m.className="gmsg"; m.innerHTML="🎉 Баяр хүргэе!<br>Өнөөдөр таны<br>жижүүрийн өдөр!<br>Амжилт хүсье!<br><small style=\"font-size:1rem\">🪙 +20 оноо</small>"; o.appendChild(m);
    var b=document.createElement("button"); b.textContent="Баярлалаа 💚"; b.style.marginTop="26px"; b.onclick=function(){ o.remove(); }; o.appendChild(b);
    setTimeout(burst,200);
  };
}

    if(isIOS() && !isStandalone()){ toast("iPhone: эхлээд Share → «Add to Home Screen», дараа нь нүүр дэлгэцийн дүрсээр нээгээд асаана уу"); return; }
    if(!("Notification" in window)){ toast("Энэ хөтөч мэдэгдэл дэмжихгүй байна"); return; }
    var ok=await syncPush(true); toast(ok?"Мэдэгдэл асалаа ✔":"Зөвшөөрөл өгөөгүй"); render(true); };
  if($("nread")) $("nread").onclick=async function(){ await rpcDo("read_notifications",{p_code:S.code}); S.notifs.forEach(function(n){n.is_read=true;}); render(true); };
  if($("giftbtn")) $("giftbtn").onclick=function(){ showGift(ubToday()); };
  if($("waterbtn")) $("waterbtn").onclick=async function(){
    var r=await rpcDo("water_plant",{p_code:S.code}); if(!r) return;
    toast(r.data?"💧 Услалаа! +5 оноо":"Өнөөдөр услаад болсон байна");
    var st=await sb.rpc("plant_stats"); if(st.data) S.stats=st.data; render(true);
  };
  /* зарлал */
  if($("annnew")) $("annnew").onclick=function(){ S.annForm={}; S.fields={}; render(true); };
  if($("anncancel")) $("anncancel").onclick=function(){ S.annForm=null; S.fields={}; render(true); };
  if($("annsave")) $("annsave").onclick=async function(){
    var btn=$("annsave"), info=$("ainfo"), row=S.annForm.row||null, title=$("a_title").value.trim();
    if(!title){ info.textContent="Гарчиг оруулна уу"; return; }
    btn.disabled=true; info.textContent="Хадгалж байна…";
    try{
      var img=row?row.image_url:null, fl=row?row.file_url:null, fi=$("a_img").files[0], ff=$("a_file").files[0];
      if(fi){ info.textContent="Зураг оруулж байна…"; img=await uploadFile(fi,8); }
      if(ff){ info.textContent="Файл оруулж байна…"; fl=await uploadFile(ff,10); }
      var body=$("a_body").value;
      var r=row?await sb.rpc("edit_announcement",{p_code:S.code,p_id:row.id,p_title:title,p_body:body,p_image:img,p_file:fl})
               :await sb.rpc("post_announcement",{p_code:S.code,p_title:title,p_body:body,p_image:img,p_file:fl});
      if(r.error) throw r.error;
      toast(row?"Хадгаллаа ✔":"Нийтэллээ ✔"); S.annForm=null; S.fields={}; await loadAll(); render();
    }catch(err){ info.textContent="Алдаа: "+(err.message||err); btn.disabled=false; }
  };
  q("[data-opencm]",function(b){ b.onclick=function(){ var id=b.getAttribute("data-opencm"); S.openAnn[id]=!S.openAnn[id]; render(true); }; });
  q("[data-sendcm]",function(b){ b.onclick=function(){ sendCmt(Number(b.getAttribute("data-sendcm"))); }; });
  q("[data-creply]",function(b){ b.onclick=function(){
    var p=b.getAttribute("data-creply").split(":"), a=Number(p[0]), id=Number(p[1]);
    var c=S.comments.filter(function(x){return Number(x.id)===id;})[0];
    S.replyC={ann:a,id:id,name:c?c.author_name:""}; render(true); var el=$("cm_"+a); if(el) el.focus();
  }; });
  q("[data-creplyx]",function(b){ b.onclick=function(ev){ ev.preventDefault(); S.replyC=null; render(true); }; });
  q("[data-delcmt]",function(b){ b.onclick=async function(){ if(!confirm("Сэтгэгдлийг устгах уу?")) return; var r=await rpcDo("delete_comment",{p_code:S.code,p_id:Number(b.getAttribute("data-delcmt"))}); if(r){ await loadAll(); render(true); } }; });
  q("[data-annedit]",function(b){ b.onclick=function(){ var id=Number(b.getAttribute("data-annedit")); S.annForm={row:S.ann.filter(function(a){return Number(a.id)===id;})[0]}; S.fields={}; render(true); window.scrollTo(0,0); }; });
  q("[data-anndel]",function(b){ b.onclick=async function(){ if(!confirm("Зарлалыг устгах уу?")) return; var r=await rpcDo("delete_announcement",{p_code:S.code,p_id:Number(b.getAttribute("data-anndel"))},"Устгалаа"); if(r){ await loadAll(); render(true); } }; });
  function flag(id,pin,hid){ var a=S.ann.filter(function(x){return Number(x.id)===id;})[0]; return rpcDo("set_announcement_flag",{p_code:S.code,p_id:id,p_pinned:pin===null?a.pinned:pin,p_hidden:hid===null?a.hidden:hid}).then(async function(r){ if(r){ await loadAll(); render(true); } }); }
  q("[data-annpin]",function(b){ b.onclick=function(){ var id=Number(b.getAttribute("data-annpin")); var a=S.ann.filter(function(x){return Number(x.id)===id;})[0]; flag(id,!a.pinned,null); }; });
  q("[data-annhide]",function(b){ b.onclick=function(){ var id=Number(b.getAttribute("data-annhide")); var a=S.ann.filter(function(x){return Number(x.id)===id;})[0]; flag(id,null,!a.hidden); }; });
  /* чат */
  q("[data-reply]",function(b){ b.onclick=function(ev){ ev.preventDefault(); S.replyMsg=Number(b.getAttribute("data-reply")); S.chatJump=true; render(true); var el=$("cbody"); if(el) el.focus(); }; });
  q("[data-delmsg]",function(b){ b.onclick=async function(ev){ ev.preventDefault(); if(!confirm("Мессежийг устгах уу?")) return; var r=await rpcDo("delete_message",{p_code:S.code,p_id:Number(b.getAttribute("data-delmsg"))}); if(r){ await loadAll(); render(true); } }; });
  if($("creplyx")) $("creplyx").onclick=function(ev){ ev.preventDefault(); S.replyMsg=null; render(true); };
  if($("csend")){
    $("cimg").onchange=function(){ S.pImg=this.files[0]||null; $("cinfo").textContent=(S.pImg?"🖼 "+S.pImg.name+" ":"")+(S.pFile?"📎 "+S.pFile.name:""); };
    $("cfile").onchange=function(){ S.pFile=this.files[0]||null; $("cinfo").textContent=(S.pImg?"🖼 "+S.pImg.name+" ":"")+(S.pFile?"📎 "+S.pFile.name:""); };
    $("csend").onclick=async function(){
      var body=$("cbody").value.trim();
      if(!body&&!S.pImg&&!S.pFile) return;
      $("csend").disabled=true;
      try{
        var iu=null, fu=null, fn=null;
        if(S.pImg){ $("cinfo").textContent="Зураг илгээж байна…"; iu=await uploadFile(S.pImg,8); }
        if(S.pFile){ $("cinfo").textContent="Файл илгээж байна…"; fu=await uploadFile(S.pFile,10); fn=S.pFile.name; }
        var r=await sb.rpc("send_message2",{p_code:S.code,p_body:body||null,p_image:iu,p_reply:S.replyMsg,p_file:fu,p_fname:fn});
        if(r.error) throw r.error;
        S.fields.cbody=""; S.pImg=null; S.pFile=null; S.replyMsg=null; S.chatJump=true;
        await loadAll(); render();
      }catch(err){ toast("Илгээж чадсангүй: "+(err.message||"")); var b=$("csend"); if(b) b.disabled=false; }
    };
  }
  /* жижүүр (админ) */
  if($("dsave")) $("dsave").onclick=async function(){
    var d=$("d_day").value, a=$("d_s1").value||null, b=$("d_s2").value||null;
    if(!d){ $("dinfo").textContent="Өдөр сонгоно уу"; return; }
    var r=await rpcDo("admin_set_duty",{p_code:S.code,p_day:d,p_s1:a||null,p_s2:b||null},"Хадгаллаа ✔");
    if(r){ await loadAll(); render(true); }
  };
  if($("dstart")) $("dstart").onclick=async function(){
    var d=$("d_start").value; if(!d){ toast("Өдөр сонгоно уу"); return; }
    var r=await rpcDo("admin_set_duty_start",{p_code:S.code,p_day:d},"Хадгаллаа ✔"); if(r){ await loadAll(); render(true); }
  };
}

if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw2.js").catch(function(){}); });
  navigator.serviceWorker.addEventListener("message",function(e){ if(e.data&&e.data.tab&&S.user){ S.tab=e.data.tab; render(); } }); }

/* ====== ЭХЛҮҮЛЭХ ====== */
(async function init(){
  var c=lsGet("code10b");
  if(!c){ showLogin(); return; }
  var r=await sb.rpc("login",{p_code:c});
  if(r.error||!r.data||!r.data.length){ showLogin(); return; }
  S.user=r.data[0]; S.code=c; start();
})();
</script>
</body>
</html>
