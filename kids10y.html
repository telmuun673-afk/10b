<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10Б анги</title>
<meta name="theme-color" content="#070B1C">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f6fc; --card:#ffffff; --card2:#eef2fa; --line:#e1e7f3;
  --text:#14203b; --muted:#6b7691; --accent:#2563eb; --accent2:#06b6d4; --onacc:#fff;
  --danger:#ef4444; --warn:#f59e0b; --radius:18px; --shadow:0 2px 10px rgba(26,42,80,.08);
}
html[data-t=green]{--accent:#16a34a;--accent2:#65a30d}
html[data-t=orange]{--accent:#ea580c;--accent2:#f59e0b}
html[data-t=red]{--accent:#e11d48;--accent2:#f97316}
html[data-m=dark]{--bg:#05070c;--card:#0e1320;--card2:#171f33;--line:#222c45;--text:#e8ecf5;--muted:#93a0bc;--accent:#3da5ff;--accent2:#1de9b6;--onacc:#06101c;--shadow:none}
html[data-m=dark][data-t=green]{--accent:#2ee59d;--accent2:#b6f23a}
html[data-m=dark][data-t=orange]{--accent:#ff9a3d;--accent2:#ffd23d}
html[data-m=dark][data-t=red]{--accent:#ff5d73;--accent2:#ff9a5d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{min-height:100vh;padding-bottom:84px}
h1,h2,h3{margin:0 0 .5rem}
h2{font-size:1.2rem}
h3{font-size:1rem;color:var(--muted);font-weight:600}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.9rem}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:inherit;margin-bottom:8px}
textarea{min-height:90px;resize:vertical}
button{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:var(--onacc);font-weight:600;cursor:pointer}
button.sec{background:var(--card2);color:var(--text);border:1px solid var(--line)}
button.danger{background:var(--danger);color:#fff}
button.small{padding:6px 10px;font-size:.85rem}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.row>.auto{flex:0 0 auto}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.topbar b{font-size:1.1rem}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;overflow-x:auto;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1 0 auto;min-width:64px;background:transparent;color:var(--muted);border-radius:0;padding:10px 6px;font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav button span{font-size:1.25rem}
.nav button.on{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.tabs button{flex:0 0 auto;background:var(--card);color:var(--text);border:1px solid var(--line);padding:8px 14px}
.tabs button.on{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
.hw{display:flex;gap:12px;align-items:flex-start}
.hw.done{opacity:.6}
.hw input[type=checkbox]{width:26px;height:26px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent2)}
.hw .body{flex:1;min-width:0}
.hw .subj{font-weight:700}
.pre{white-space:pre-wrap;word-wrap:break-word}
.hw img,.msg img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);word-wrap:break-word}
.msg.me{align-self:flex-end;background:var(--accent);border-color:var(--accent);color:var(--onacc)}
.msg .who{font-size:.75rem;opacity:.75;margin-bottom:2px}
.msg .t{font-size:.7rem;opacity:.6;margin-top:2px}
.composer{position:sticky;bottom:72px;background:var(--bg);padding:8px 0}
.period{display:flex;gap:12px;align-items:center}
.period .n{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.login{max-width:380px;margin:12vh auto 0;text-align:center}
.login h1{font-size:2rem}
.err{color:var(--danger);min-height:1.4em;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;z-index:50}
.hide{display:none!important}
.actions{display:flex;gap:6px;margin-top:8px}
.hero2{border-radius:22px;padding:22px 20px;position:relative;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.hero2:after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.1)}
.hero2:before{content:"";position:absolute;right:50px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero2 small{opacity:.85;font-size:.8rem}
.hero2 h1{margin:4px 0 6px;font-size:2.1rem;letter-spacing:-.5px;font-style:italic}
.hero2 p{margin:0;font-size:.9rem;opacity:.9}
.date{position:absolute;right:14px;top:14px;color:#fff;background:rgba(0,0,0,.28);padding:6px 11px;border-radius:99px;font-size:.75rem;z-index:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.stat span{font-size:.7rem;color:var(--muted);display:block}
.stat b{font-size:1.4rem;display:block;margin-top:4px}
.stat i{font-style:normal;font-size:.7rem;color:var(--accent2)}
.cardh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700}
.cardh a{font-size:.75rem;color:var(--accent);font-weight:500}
.duty{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:var(--card2);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.person.me{outline:2px solid var(--accent2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--onacc);background:linear-gradient(135deg,var(--accent),var(--accent2));flex:0 0 auto}
.person b{font-size:.9rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person small{color:var(--muted);font-size:.7rem}
.week{display:flex;gap:6px;margin-top:12px}
.week div{flex:1;min-width:0;text-align:center;font-size:.7rem;color:var(--muted);background:var(--card2);border-radius:12px;padding:8px 2px}
.week div.today{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc);font-weight:700}
.week div em{display:block;font-style:normal;font-size:.62rem;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.plant{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}
.glass{height:140px;border-radius:64px 64px 16px 16px;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.12),rgba(255,255,255,.03));border:1px solid var(--line);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.pct{font-size:1.9rem;font-weight:800}
.bar{height:10px;border-radius:9px;background:var(--card2);overflow:hidden;margin:6px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px}
.rank{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.rank.first{border-top:0}
.rank .n{width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:.75rem;font-weight:700;flex:0 0 auto}
.rank.g1 .n{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc)}
.rank .nm{flex:1;font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank.me .nm{color:var(--accent2);font-weight:700}
.rank .mini{width:60px;height:7px;border-radius:5px;background:var(--card2);overflow:hidden;flex:0 0 auto}
.rank .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.rank .lv{font-size:.75rem;color:var(--muted);width:42px;text-align:right}
.hwr{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hwr.first{border-top:0}
.hwr .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-size:1.1rem;background:var(--card2)}
.hwr b{font-size:.9rem;display:block}.hwr small{color:var(--muted);font-size:.78rem}
.chk{margin-left:auto;width:26px;height:26px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-size:.9rem;flex:0 0 auto}
.chk.on{background:var(--accent2);border-color:var(--accent2);color:var(--onacc)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 4px;text-align:center;font-size:.75rem;color:var(--text);font-weight:500;display:block}
.tile u{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;margin:0 auto 6px;font-size:1.4rem;text-decoration:none;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 70%,#000),color-mix(in srgb,var(--accent2) 60%,#000))}
.slogan{color:var(--text);border-radius:18px;padding:16px;text-align:center;font-style:italic;font-weight:700;margin-bottom:14px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 22%,var(--card)),color-mix(in srgb,var(--accent2) 18%,var(--card)))}
.dots{display:flex;gap:12px;align-items:center}
.dot{width:32px;height:32px;border-radius:50%;border:3px solid transparent;padding:0}
.dot.on{border-color:#fff}
.nav button{position:relative}
.nav .bdg{position:absolute;top:4px;right:calc(50% - 22px);background:var(--danger);color:#fff;border-radius:99px;font-size:.62rem;min-width:16px;height:16px;line-height:16px;padding:0 4px}

.pill.pin{background:var(--accent);color:var(--onacc);border-color:var(--accent);font-weight:700}
.pill.hid{background:var(--danger);color:#fff;border-color:var(--danger)}
.reacts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center;position:relative}
.rx{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:3px 9px;font-size:.85rem;font-weight:500}
.rx.mine{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--card2))}
.rx.add{color:var(--muted)}
.picker{display:flex;gap:4px;background:var(--card2);border:1px solid var(--line);border-radius:99px;padding:4px 6px;width:100%;max-width:290px;justify-content:space-around}
.picker button{background:transparent;padding:2px 6px;font-size:1.3rem;color:inherit}
.cmts{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.cmt{padding:6px 0}
.cmt.n1{margin-left:16px;border-left:2px solid var(--line);padding-left:10px}
.cmt.n2,.cmt.n3{margin-left:12px;border-left:2px solid var(--line);padding-left:10px}
.cmt .who{font-weight:700;font-size:.85rem}.cmt .t{color:var(--muted);font-size:.72rem}
.mini{display:inline-block;background:none;color:var(--muted);padding:2px 6px;font-size:.78rem;font-weight:500}
.banner{background:var(--card2);border-left:3px solid var(--accent);border-radius:8px;padding:6px 10px;font-size:.82rem;margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.quote{border-left:3px solid var(--accent2);padding:2px 8px;margin-bottom:4px;font-size:.78rem;opacity:.8;background:rgba(255,255,255,.06);border-radius:4px}
.fileln{display:inline-block;margin-top:6px;background:rgba(255,255,255,.1);padding:6px 10px;border-radius:8px;font-size:.85rem}
.bell{position:relative;background:transparent;font-size:1.3rem;padding:4px 8px;color:var(--text)}
.bell i{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.62rem;font-style:normal;border-radius:99px;min-width:16px;height:16px;line-height:16px;text-align:center}
.nt{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.nt:first-child{border-top:0}
.nt.unread b{color:var(--accent2)}
.sw{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sw input{width:26px;height:26px;margin:0;accent-color:var(--accent2)}
.mystar{color:var(--accent2)}
.crown{font-size:1rem}
.gift{position:fixed;inset:0;z-index:100;background:rgba(3,6,14,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
.giftbox{font-size:120px;line-height:1;cursor:pointer;animation:wig 1.2s ease-in-out infinite;filter:drop-shadow(0 0 28px var(--accent))}
@keyframes wig{0%,100%{transform:rotate(-6deg) scale(1)}25%{transform:rotate(7deg) scale(1.08)}50%{transform:rotate(-4deg) scale(1)}75%{transform:rotate(5deg) scale(1.1)}}
.gift h2{font-size:1.5rem;margin:14px 0 6px}
.gift .tapme{color:var(--muted)}
.gmsg{font-size:1.5rem;font-weight:800;line-height:1.3;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.spark{position:absolute;left:50%;top:42%;pointer-events:none;font-size:22px;transition:transform 1.4s cubic-bezier(.1,.8,.3,1),opacity 1.4s;opacity:1}
.mdl{font-size:.8rem}

/* ===== шинэ: avatar, асуулт, дэлгүүр, өрөө ===== */
.avt{position:relative;display:inline-block;flex:0 0 auto;text-align:center;line-height:1}
.avt .b{display:block}
.avt .h{position:absolute;left:50%;top:-34%;transform:translateX(-50%);font-size:.62em;line-height:1}
.avt .g{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:.52em;line-height:1}
.avt .o{position:absolute;right:-12%;bottom:-6%;font-size:.5em;line-height:1}
.avt .hd{position:absolute;left:-16%;bottom:-4%;font-size:.5em;line-height:1}
.coin{font-weight:800}
.wall_mint{background:linear-gradient(#d1fae5,#a7f3d0)}
.wall_night{background:linear-gradient(#0f172a,#1e3a8a)}
.wall_sea{background:linear-gradient(#bae6fd,#38bdf8 70%,#0ea5e9)}
.wall_cloud{background:linear-gradient(#e0f2fe,#fff)}
.wall_gold{background:linear-gradient(#fef3c7,#f59e0b)}
.flr_wood{background:linear-gradient(#d9b98a,#c9a273)}
.flr_grass{background:linear-gradient(#86efac,#4ade80)}
.flr_blue{background:linear-gradient(#93c5fd,#60a5fa)}
.flr_check{background:repeating-conic-gradient(#e5e7eb 0 25%,#9ca3af 0 50%) 0 0/36px 36px}
.flr_sand{background:linear-gradient(#fde68a,#fcd34d)}
.flr_red{background:linear-gradient(#fca5a5,#ef4444)}
.it2.fl{animation:flo 3s ease-in-out infinite}
.wall_v_aurora{background:linear-gradient(#0b1026,#0f766e 55%,#7c3aed)}
.wall_v_royal{background:linear-gradient(#7f1d1d,#b45309 60%,#fbbf24)}
.wall_beach{background:linear-gradient(#7dd3fc,#bae6fd 55%,#fde68a)}
.flr_v_marble{background:linear-gradient(135deg,#f8fafc,#cbd5e1 50%,#f1f5f9)}
.flr_carpet{background:repeating-linear-gradient(90deg,#b91c1c 0 14px,#991b1b 14px 28px)}
.flr_snow{background:linear-gradient(#f8fafc,#dbeafe)}
.avt2{border-radius:50%;overflow:hidden;background:linear-gradient(color-mix(in srgb,var(--accent2) 22%,var(--card2)),var(--card2));vertical-align:middle}
.avt2 svg{display:block;margin:0 auto}
.room{height:auto!important;aspect-ratio:430/300;position:relative;overflow:hidden;border-radius:22px}
.it2.sel,.shopgrid .it.sel{outline:3px dashed var(--accent);outline-offset:2px;border-radius:10px}
.vb{position:absolute;right:-3px;bottom:-3px;line-height:1}
.vb2{display:block;font-size:.65rem;color:#7c3aed;font-weight:800}
@keyframes flo{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.it2.fl{animation:none}}
.strk{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.25);color:#fff;border-radius:99px;padding:5px 11px;font-size:.78rem;font-weight:700;z-index:1}
.qhero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(135deg,#f59e0b,#f97316);margin-bottom:12px}
.qhero small{opacity:.9}.qhero h2{font-size:1.15rem;margin:6px 0 0;line-height:1.35}
.opt{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:16px;padding:14px;margin-bottom:9px;font-weight:600}
.opt.ok{border-color:#22c55e;background:rgba(34,197,94,.12)}
.opt.bad{border-color:var(--danger);background:rgba(239,68,68,.1)}
.opt.sel{border-color:var(--accent)}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.it{background:var(--card2);border:2px solid transparent;border-radius:16px;padding:10px 4px;text-align:center;font-size:.72rem;color:var(--text);font-weight:600;display:block;width:100%}
.it b{display:block;font-size:2rem;font-weight:400;margin-bottom:2px}
.it.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card))}
.it span{display:block;color:var(--warn);font-weight:800;margin-top:2px}
.it span.own{color:var(--accent)}
.room{height:300px;border-radius:22px;position:relative;overflow:hidden}
.room .floor{position:absolute;left:0;right:0;bottom:0;height:46%;box-shadow:inset 0 6px 10px rgba(0,0,0,.12)}
.room .it2{position:absolute;font-size:1.85rem;line-height:1}
.wall_sky{background:linear-gradient(#bfe3ff,#e8f5ff)}
.wall_sunset{background:linear-gradient(#ffb199,#ff7e5f 55%,#feb47b)}
.wall_space{background:linear-gradient(#0b1026,#2a1b5c)}
.wall_forest{background:linear-gradient(#b7e4c7,#74c69d)}
.big{font-size:2rem}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.rowbtn{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.rowbtn>*{flex:0 0 auto}
/* ===== 10B WORLD ===== */
.room .it2{animation:drop .45s ease-out both}
@keyframes drop{from{opacity:0;transform:translateY(-10px) scale(.85)}to{opacity:1;transform:none}}
.room .it2.fl{animation:flo 3s ease-in-out infinite}
@keyframes glowp{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 16px 2px var(--accent)}}
.opt.sel{animation:glowp 1.5s ease-in-out infinite}
.world{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;overflow:hidden;
 --bg:#0B1020;--card:#121a36;--card2:#18224a;--line:#2f3d86;--text:#e8ecfa;--muted:#9aa5c8;--accent:#168CFF;--accent2:#8B5CF6;--onacc:#fff;--shadow:none;
 background:radial-gradient(120% 55% at 50% -8%,#2a1b6e 0,#0B1020 58%);color:var(--text)}
.world:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 28%,rgba(22,140,255,.2) 0,transparent 30%),radial-gradient(circle at 92% 62%,rgba(139,92,246,.22) 0,transparent 34%)}
.wtop{position:relative;display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.wtop .coin{margin-left:auto;font-weight:800;color:#FFC857}
.wx{background:#18224a;color:#e8ecfa;border:1px solid #2f3d86;border-radius:12px;padding:8px 12px;font-weight:700;width:auto}
.wbody{position:relative;flex:1;overflow:auto;padding:2px 14px 100px;-webkit-overflow-scrolling:touch}

/* ===== ANIME HOME ===== */
.ah{--p1:#ff6fa5;--p2:#8b5cf6;--p3:#22d3ee;--p4:#ffc857}

.ahero{position:relative;height:232px;border-radius:28px 28px 28px 8px;overflow:hidden;margin-bottom:14px;color:#fff;
 background:linear-gradient(180deg,#2b1055 0%,#7a2e8e 38%,#ff6fa5 72%,#ffb48a 100%);box-shadow:0 14px 40px -12px rgba(255,111,165,.55)}

.ahero .who{position:absolute;right:16px;bottom:-6px;z-index:4;width:104px;animation:flo 3.6s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(30,10,60,.5))}
.ahero .bub{position:absolute;left:18px;bottom:18px;z-index:5;background:rgba(255,255,255,.95);color:#2b1055;border-radius:16px 16px 16px 4px;padding:8px 12px;font-weight:800;font-size:.86rem;max-width:58%;box-shadow:0 6px 16px rgba(30,10,60,.3);animation:bubin .6s .5s both}

.abento{display:grid;grid-template-columns:1.15fr 1fr 1fr;gap:10px;margin-bottom:14px}
.at{position:relative;overflow:hidden;border-radius:20px 20px 20px 6px;padding:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}

.ah>.card{position:relative;overflow:hidden;border-radius:22px 22px 22px 6px;padding-left:18px}

/* ===== 10B NEON UI (visual only) ===== */
:root{--vio:#8B45FF;--cy:#20E7FF;--g2:#8B45FF;--bg:#EEF2FF;--card:#ffffff;--card2:#EAEFFD;--line:#D5DEF7;--text:#12183A;--muted:#5C6890;--accent:#287BFF;--accent2:#20B7D8;--shadow:0 6px 22px -12px rgba(40,123,255,.35)}

async function uploadFile(file,maxMB){
  if(file.size>(maxMB||10)*1024*1024) throw new Error("Файл "+(maxMB||10)+"MB-аас том байна");
  var ext=(file.name.split(".").pop()||"bin").toLowerCase().replace(/[^a-z0-9]/g,"").slice(0,8)||"bin";
  var path=Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
  var r=await sb.storage.from("uploads").upload(path,file,{contentType:file.type||undefined});

  return sb.storage.from("uploads").getPublicUrl(path).data.publicUrl;
}

function reactBar(t,id){
  var key=t+":"+id, m=S.R[key]||{}, h='<div class="reacts">';
  EMO.forEach(function(e){ if(m[e]&&m[e].length){ var mine=m[e].indexOf(me())>=0; h+='<button class="rx'+(mine?" mine":"")+'" data-rx="'+key+':'+e+'" title="'+esc(m[e].join(", "))+'">'+e+' '+m[e].length+'</button>'; } });

  var any=EMO.some(function(e){return m[e]&&m[e].length;});
  if(any) h+='<button class="rx add" data-rxnames="'+key+'" title="Хэн дарсан">👥</button>';
  if(S.picker===key) h+='<div class="picker">'+EMO.map(function(e){return '<button data-rx="'+key+':'+e+'">'+e+'</button>';}).join("")+'</div>';

function cmtTree(a){
  var all=S.comments.filter(function(c){return Number(c.ann_id)===Number(a.id);});
  function node(c,d){
    var kids=all.filter(function(k){return Number(k.parent_id)===Number(c.id);});
    var h='<div class="cmt n'+Math.min(d,3)+'"><span class="who">'+esc(c.author_name)+'</span> <span class="t">'+fmtTime(c.created_at)+'</span><div class="pre">'+esc(c.body)+'</div>'+reactBar("comment",c.id)+
      '<button class="mini" data-creply="'+a.id+':'+c.id+'">↩ Хариу</button>'+((c.author_name===me()||S.user.is_admin)?'<button class="mini" data-delcmt="'+c.id+'">🗑</button>':"");
    kids.forEach(function(k){ h+=node(k,d+1); });
    return h+'</div>';
  }
  var h='<div class="cmts">';
  all.filter(function(c){return !c.parent_id;}).forEach(function(c){ h+=node(c,0); });
  var rc=S.replyC&&S.replyC.ann===a.id?S.replyC:null;
  if(rc) h+='<div class="banner"><span>↩ '+esc(rc.name)+' сэтгэгдэлд хариу</span><a href="#" data-creplyx="1">✕</a></div>';
  h+='<div class="row"><input id="cm_'+a.id+'" placeholder="Сэтгэгдэл бичих…" style="margin:0"><button class="auto small" data-sendcm="'+a.id+'">➤</button></div></div>';
  return h;
}

async function adminSave(){
  var kind=S.adminKind, e=S.edit&&S.edit.row?S.edit.row:null, row={}, info=$("ainfo"), btn=$("asave");
  function v(id){ var el=$(id); return el?el.value.trim():""; }
  btn.disabled=true; info.textContent="Хадгалж байна…";
  try{
    if(kind==="homework"){
      if(!v("f_subject")) throw new Error("Хичээлийн нэр оруулна уу");
      row={day:v("f_day"),subject:v("f_subject"),description:v("f_description")||null,image_url:e?e.image_url:null,file_url:e?e.file_url:null};
      var im=$("f_img").files[0], fl=$("f_file").files[0];
      if(im){ info.textContent="Зураг оруулж байна…"; row.image_url=await uploadFile(im,8); }
      if(fl){ info.textContent="Файл оруулж байна…"; row.file_url=await uploadFile(fl,10); }
    } else if(kind==="schedule"){
      if(!v("f_subject")||!v("f_period")) throw new Error("Цаг болон хичээлийн нэр оруулна уу");
      row={day:v("f_day"),period:v("f_period"),subject:v("f_subject"),time:v("f_time")||null};
    } else {
      if(!v("f_title")) throw new Error("Гарчиг оруулна уу");
      row={kind:v("f_kind"),title:v("f_title"),subject:v("f_subject")||null,url:v("f_url")||(e?e.url:null)};
      var f2=$("f_file").files[0];
      if(f2){ info.textContent="Файл оруулж байна…"; row.url=await uploadFile(f2,10); }
    }
    if(e) row.id=String(e.id);
    var r=await sb.rpc("admin_save",{p_code:S.code,p_table:kind,p_row:row});
    if(r.error) throw r.error;
    toast("Хадгаллаа ✔"); S.edit=null; S.fields={}; await loadAll(); render();
  }catch(err){ info.textContent="Алдаа: "+(err.message||err); btn.disabled=false; }
}

 бодис бүр уусгагчтай хамт цаасан дээгүүр өөр өөр хурдаар шилждэг тул ялгарна. Энэ арга нь ЦААСАН ХРОМАТОГРАФИ."}, {"id": "1.9", "q": "Магнийн сульфатын томьёог сонгоно уу", "o": ["MgS", "Mg(SO₄)₂", "Mg₂SO₄", "MgSO₄"], "c": 3, "e": "Mg-ийн цэнэг +2, сульфат ион SO₄ -ийн цэнэг −2. Цэнэг нь тэнцүү тул 1:1 харьцаатай → MgSO₄."}, {"id": "1.10", "q": "H₂SO₄ хүхрийн хүчлийн молийн массыг ол", "o": ["96 г/моль", "64 г/моль", "49 г/моль", "98 г/моль"], "c": 3, "e": "M(H₂SO₄)=2·1 + 32 + 4·16 = 2 + 32 + 64 = 98 г/моль."}, {"id": "1.12", "q": "Ca²⁺ ионы электрон хэд вэ?", "o": ["20", "18", "22", "2"], "c": 1, "e": "Ca-ийн атомын дугаар 20 тул 20 электронтой. Ca²⁺ нь 2 электроноо алдсан тул 20 − 2 = 18 электронтой (аргоны бүтэцтэй). Протон нь 20 хэвээр."}, {"id": "1.13", "q": "27 г ус хэдэн моль вэ?", "o": ["3 моль", "1,5 моль", "0,5 моль", "2,7 моль"], "c": 1, "e": "M(H₂O)=18 г/моль. n = m / M = 27 / 18 = 1,5 моль."}, {"id": "1.14", "q": "2,5 моль ус хэдэн ширхэг молекул агуулах вэ?", "o": ["15,05·10²³ ширхэг", "2,5·10²³ ширхэг", "45·10²³ ширхэг", "6,02·10²³ ширхэг"], "c": 0, "e": "N = n · Nₐ = 2,5 · 6,02·10²³ = 15,05·10²³ = 1,505·10²⁴ ширхэг."}, {"id": "1.15", "q": "160 г хүчилтөрөгч (O₂)-ийн эзлэхүүнийг стандарт нөхцөлд тооцоол", "o": ["32 л", "124 л", "5 л", "112 л"], "c": 1, "e": "1) M(O₂)=2·16=32 г/моль. 2) n = m/M = 160/32 = 5 моль. 3) Стандарт нөхцөлд Vm=24,8 л/моль тул V = n·Vm = 5·24,8 = 124 л. (112 л нь хэвийн нөхцөлд 5·22,4 гэсэн утга.)"}, {"id": "1.16", "q": "Al₂(SO₄)₃-ийн харьцангуй масс (Mr)-ыг ол", "o": ["342", "294", "171", "150"], "c": 0, "e": "Mr = 2·Ar(Al) + 3·(Ar(S) + 4·Ar(O)) = 2·27 + 3·(32 + 4·16) = 54 + 3·96 = 54 + 288 = 342. Нэгдлийн хувьд харьцангуй томьёоны (молекулын) масс гэж нэрлэнэ."}, {"id": "1.17", "q": "Хийн молийн эзлэхүүний томьёог сонгоно уу", "o": ["Vm = m / M", "Vm = n · Nₐ", "Vm = n / V", "Vm = V / n"], "c": 3, "e": "Молийн эзлэхүүн = хийн эзлэхүүн ÷ бодисын тоо хэмжээ: Vm = V / n (л/моль). m/M нь моль олох томьёо."}, {"id": "1.18", "q": "Агаарын найрлагын 78 %-ийг ямар элемент эзэлдэг вэ?", "o": ["Азот", "Аргон", "Нүүрстөрөгч", "Хүчилтөрөгч"], "c": 0, "e": "Агаарын ойролцоогоор 78 % азот (N₂), 21 % хүчилтөрөгч (O₂), 1 % бусад хий (аргон, CO₂ гэх мэт)."}, {"id": "1.19", "q": "Азотын хүчлийн томьёог сонгоно уу", "o": ["NH₃", "HNO₂", "H₂SO₄", "HNO₃"], "c": 3, "e": "Азотын хүчил = HNO₃. HNO₂ нь азотист хүчил, H₂SO₄ нь хүхрийн хүчил, NH₃ нь аммиак."}, {"id": "1.20", "q": "0,5 моль хүхрийн хүчлийн массыг ол", "o": ["98 г", "49 г", "196 г", "24,5 г"], "c": 1, "e": "M(H₂SO₄)=98 г/моль. m = n · M = 0,5 · 98 = 49 г."}], "ph": [{"id": "2.1", "q": "Нүүрс шатах үед химийн энерги ямар энергид хувирах вэ?", "o": ["Цахилгаан энерги", "Механик потенциал энерги", "Цөмийн энерги", "Дулааны (мөн гэрлийн) энерги"], "c": 3, "e": "Шаталтын үед химийн энерги ялгарч ДУЛААНЫ (мөн гэрлийн) энерги болно. Нүүрс шатахад дулаан ба гэрэл гарахыг санаарай."}, {"id": "2.2", "q": "Динамометрээр юуг хэмждэг вэ?", "o": ["Хурдыг", "Массыг", "Хүчийг", "Температурыг"], "c": 2, "e": "Динамометр нь пүршний уян харимхай хүчинд суурилж ХҮЧ хэмждэг багаж. Масс нь жин (тавиур)-аар, температур нь термометрээр хэмжигдэнэ."}, {"id": "2.3", "q": "Нэг цагт хэдэн секунд багтах вэ?", "o": ["60 секунд", "3600 секунд", "360 секунд", "1440 секунд"], "c": 1, "e": "1 цаг = 60 минут, 1 минут = 60 секунд. Иймд 60 · 60 = 3600 секунд."}, {"id": "2.4", "q": "27 °C температурыг Кельвиний хуваариар илэрхийл", "o": ["246 К", "373 К", "27 К", "300 К"], "c": 3, "e": "T(K) = t(°C) + 273. Иймд 27 + 273 = 300 К. (Яг тооцоогоор 273,15 боловч сургуульд 273 авдаг.)"}, {"id": "2.5", "q": "Гал тогооны сав суулгыг физикийн ямар үзэгдэлд үндэслэн металлаар хийдэг вэ?", "o": ["Металл дулааныг сайн дамжуулдаг", "Металл гэрэл сайн нэвтрүүлдэг", "Металл хөнгөн", "Металл дуу чимээ шингээдэг"], "c": 0, "e": "Металл нь дулаан дамжуулах чанар (дулаан дамжилт) өндөр тул хоол хурдан халдаг. Тиймээс сав суулгыг металлаар хийнэ."}, {"id": "2.6", "q": "Хүйтэн аяганд халуун цай хийхэд дулааны энергиэ хэрхэн солилцох вэ?", "o": ["Халуун цай дулаанаа хүйтэн аяганд өгнө", "Хүйтэн аяга дулаанаа цайнд өгнө", "Хоёулаа ижил хэмжээгээр хөрнө", "Дулаан солилцохгүй"], "c": 0, "e": "Дулаан үргэлж ХАЛУУН биеэс ХҮЙТЭН бие рүү шилждэг. Тиймээс цай хөрч, аяга халж, хоёр температур тэнцэх хүртэл үргэлжилнэ (дулааны тэнцвэр)."}, {"id": "2.7", "q": "Траекторын уртыг юу гэж нэрлэх вэ?", "o": ["Шилжилт", "Хугацаа", "Зам", "Хурд"], "c": 2, "e": "Траектор бол биеийн хөдөлсөн шугам. Түүний УРТ нь ЗАМ (s) юм. Шилжилт нь эхлэл ба төгсгөлийг холбосон шулуун (вектор)."}, {"id": "2.8", "q": "Бие тулгуураа дарж байгаа хүчийг юу гэдэг вэ?", "o": ["Биеийн жин", "Уян харимхай хүч", "Таталцлын хүч", "Үрэлтийн хүч"], "c": 0, "e": "Бие тулгуур эсвэл түдгэлзүүлэгчийг дарах хүчийг ЖИН (P) гэнэ. Таталцлын хүч нь биед үйлчилнэ, жин нь тулгуурт үйлчилнэ."}, {"id": "2.9", "q": "Үрэлтийн хүч хөдөлгөөнд юу учруулдаг вэ?", "o": ["Массыг нэмдэг", "Хөдөлгөөнийг саатуулдаг (эсэргүүцдэг)", "Хөдөлгөөнийг хурдасгадаг", "Хөдөлгөөнд нөлөөлөхгүй"], "c": 1, "e": "Үрэлтийн хүч хөдөлгөөний эсрэг чиглэлд үйлчилж хөдөлгөөнийг саатуулна. (Алхахад үрэлт байхгүй бол гулсана гэх мэт ашигтай тал ч бий.)"}, {"id": "2.10", "q": "Хүчний нэгж юу вэ?", "o": ["Ватт (Вт)", "Паскаль (Па)", "Ньютон (Н)", "Жоуль (Ж)"], "c": 2, "e": "Хүчний нэгж — Ньютон (Н). Жоуль нь энерги, паскаль нь даралт, ватт нь чадлын нэгж."}, {"id": "2.11", "q": "Уян харимхай хүчний хуулийг хэний хууль гэдэг вэ?", "o": ["Архимедийн хууль", "Ньютоны хууль", "Паскалийн хууль", "Гукийн хууль"], "c": 3, "e": "Пүршний уян харимхай хүч сунгалтад шууд пропорциональ гэсэн хуулийг Английн эрдэмтэн Роберт Гук нээсэн: F = k·Δl."}, {"id": "2.12", "q": "Биеийн массын төв доор байвал бие ямар байх вэ?", "o": ["Эргэнэ", "Хөнгөн болно", "Тогтвортой", "Тогтворгүй"], "c": 2, "e": "Массын төв доор, тулгуурын талбай том байх тусам бие тогтвортой. Жишээ нь «ванька-встанька» тоглоом уналтаас босдог."}, {"id": "2.13", "q": "км, м, см нэгжүүд ямар хэмжигдэхүүний нэгж вэ?", "o": ["Урт", "Хугацаа", "Хүч", "Масс"], "c": 0, "e": "Километр, метр, сантиметр нь УРТЫН нэгж."}, {"id": "2.14", "q": "Гэрэл, дуу хоёрын аль нь илүү хурдан вэ?", "o": ["Гэрэл", "Дуу", "Нөхцлөөс хамаарна", "Адил хурдтай"], "c": 0, "e": "Гэрлийн хурд ойролцоогоор 300 000 км/с, дууны хурд агаарт ~340 м/с. Тиймээс аянгыг эхэлж харж, дараа нь дуугаа сонсдог."}, {"id": "2.15", "q": "Хүнд ба хөнгөн 2 биеийн массын төв алиндаа ойрхон байрлах вэ?", "o": ["Аль алинаас ижил зайд", "Хүнд биедээ", "Хөнгөн биедээ", "Яг голд нь"], "c": 1, "e": "Массын төв нь хүнд биед ойр байрлана (дүүжингийн хөшүүрэг шиг). Хэрэв масс нь 2 дахин их бол төв нь тэр биеэс 2 дахин ойр."}, {"id": "2.16", "q": "Вектор хэмжигдэхүүний онцлог юу вэ?", "o": ["Тоон утга болон чиглэлтэй", "Зөвхөн тоон утгатай", "Зөвхөн чиглэлтэй", "Нэгжгүй"], "c": 0, "e": "Вектор хэмжигдэхүүн (хүч, шилжилт, хурд) нь ТООН УТГА БА ЧИГЛЭЛтэй. Скаляр (масс, хугацаа, температур) зөвхөн тоон утгатай."}, {"id": "2.17", "q": "Километр, метр, грамм, ньютон нэгжүүдийн аль нь СИ системийн үндсэн нэгж вэ?", "o": ["Метр", "Грамм", "Ньютон", "Километр"], "c": 0, "e": "СИ-ийн үндсэн нэгжүүд: метр (урт), килограмм (масс), секунд (хугацаа), кельвин, ампер, моль, кандела. Километр, грамм нь үүсмэл (кратын), ньютон нь үүсмэл нэгж. Жагсаалтаас зөвхөн МЕТР үндсэн нэгж."}, {"id": "2.18", "q": "Биеийн хурд өөрчлөгдөх хөдөлгөөнийг ямар хөдөлгөөн гэдэг вэ?", "o": ["Жигд бус (хувьсах хурдтай) хөдөлгөөн", "Жигд хөдөлгөөн", "Тайван байдал", "Тойрог хөдөлгөөн"], "c": 0, "e": "Хурд тогтмол бол жигд хөдөлгөөн, хурд өөрчлөгдвөл ЖИГД БУС хөдөлгөөн. Хурд нэмэгдэж эсвэл буурч болно."}, {"id": "2.19", "q": "Үрэлтийн хүчний томьёог сонгоно уу", "o": ["F = μ·N", "F = P / S", "F = m·g·h", "F = m / V"], "c": 0, "e": "Гулсах үрэлтийн хүч F = μ·N (μ — үрэлтийн коэффициент, N — тулгуурын урвалын хүч). P/S нь даралт."}, {"id": "2.20", "q": "Нэгэн төрлийн хавтгай гурвалжин хэлбэртэй биеийн массын төв юуны огтлолцол дээр байх вэ?", "o": ["Биссектрисуудын огтлолцол", "Медиануудын огтлолцол", "Өндрүүдийн огтлолцол", "Талуудын дундаж перпендикулярын огтлолцол"], "c": 1, "e": "Нэгэн төрлийн гурвалжин ялтасны массын төв нь МЕДИАНУУДЫН огтлолцол дээр байна (орой бүрээс эсрэг талын дундаж руу татсан шулуун)."}], "bi": [{"id": "3.1", "q": "Байгаль дахь олон янзын амьд биеүдийг ялган ангилж, бичиглэн тодорхойлж, нэршил оноодог биологийн салбар шинжлэх ухааныг нэрлэнэ үү", "o": ["Анатоми", "Систематик", "Генетик", "Экологи"], "c": 1, "e": "Амьд биеийг ялган ангилж нэр өгдөг шинжлэх ухаан бол СИСТЕМАТИК (ангилал зүй). Экологи — орчинтой харьцаа, генетик — удамшил, анатоми — бүтэц судалдаг."}, {"id": "3.2", "q": "Зүйлийн хос нэршлийн зарчмыг боловсруулсан эрдэмтэн хэн бэ?", "o": ["Карл Линней", "Чарльз Дарвин", "Луи Пастер", "Грегор Мендель"], "c": 0, "e": "Шведийн эрдэмтэн Карл Линней амьтан, ургамлыг хоёр латин үгээр (төрөл + зүйл) нэрлэх хос нэршлийг оруулсан. Жишээ: Homo sapiens."}, {"id": "3.3", "q": "Ангилал зүйн хамгийн бага нэгж юу вэ?", "o": ["Төрөл", "Баг", "Овог", "Зүйл"], "c": 3, "e": "Ангилалын шатлал: хаант улс → хүрээ → анги → баг → овог → төрөл → ЗҮЙЛ. Хамгийн бага нэгж нь зүйл."}, {"id": "3.4", "q": "Хавч хэдэн хос хөлтэй вэ?", "o": ["4 хос (8 хөл)", "5 хос (10 хөл)", "3 хос (6 хөл)", "7 хос (14 хөл)"], "c": 1, "e": "Хавч хэлбэртнүүдийн ангийн онцлог шинж: 5 хос буюу 10 хөлтэй. Шавж 3 хос, аалз хэлбэртэн 4 хос хөлтэй тул андуурч болохгүй."}, {"id": "3.5", "q": "Бие нь толгой, цээж, хэвэл гэсэн 3 хэсгээс тогтдог ямар үет хөлтөн амьтан байдаг вэ?", "o": ["Шавж", "Олон хөлт", "Хавч хэлбэртэн", "Аалз хэлбэртэн"], "c": 0, "e": "Шавжийн бие толгой, цээж, хэвэл гэсэн 3 хэсэгтэй, 3 хос (6) хөлтэй. Аалз хэлбэртэн 2 хэсэгтэй (толгой-цээж, хэвэл), 4 хос хөлтэй."}, {"id": "3.6", "q": "Сормууст хорхой, соруулт хорхой, хос соруулт хорхой, туузан хорхой зэрэг амьтад ямар хүрээнд хамаарагдах вэ?", "o": ["Цагирагт хорхойтон", "Хавтгай хорхойтон", "Дугуй хорхойтон", "Нэг эстэн"], "c": 1, "e": "Эдгээр нь бие нь хавтгай, ходоод гэдэсний хөндийгүй (эсвэл сул) ХАВТГАЙ ХОРХОЙТОН хүрээний төлөөлөгчид. Дугуй хорхой нь дугуй биетэй, цагирагт хорхой (шороон хорхой) нь сегментлэгдсэн биетэй."}, {"id": "3.7", "q": "Хагас нэвтрүүлэгч мембранаар ус шилжих үзэгдлийг юу гэж нэрлэх вэ?", "o": ["Фотосинтез", "Осмос", "Плазмолиз", "Диффуз"], "c": 1, "e": "Хагас нэвтрүүлэгч мембранаар усны молекулууд бага концентрацитай талаас их концентрацитай тал руу шилжихийг ОСМОС гэнэ. Диффуз нь бодисын ерөнхий тархалт."}, {"id": "3.9", "q": "Эсийг концентраци ихтэй уусмалд хийхэд протоплазм эсийн бүрхүүлээс салахыг юу гэж нэрлэдэг вэ?", "o": ["Осмос", "Плазмолиз", "Денатураци", "Фотолиз"], "c": 1, "e": "Эс ус алдаж протоплазм хүрээгээсээ салж нарийсахыг ПЛАЗМОЛИЗ гэнэ. Эсийг цэвэр усанд хийвэл эсрэгээр бөөлжинө (тургор)."}, {"id": "3.10", "q": "Концентраци ихтэй уусмалыг юу гэх вэ?", "o": ["Гипотоник", "Изотоник", "Хэвийн", "Гипертоник"], "c": 3, "e": "ГИПЕРТОНИК уусмал нь эсийн шүүснээс илүү их концентрацитай тул эсээс ус гарч эс жижгэрнэ (плазмолиз)."}, {"id": "3.11", "q": "Концентраци багатай уусмалыг юу гэх вэ?", "o": ["Хүчиллэг", "Гипертоник", "Гипотоник", "Изотоник"], "c": 2, "e": "ГИПОТОНИК уусмал нь эсийн шүүснээс бага концентрацитай тул эсэд ус орж эс хавагнана."}, {"id": "3.12", "q": "Эсийн шүүстэй адил концентрацитай уусмалыг юу гэх вэ?", "o": ["Изотоник", "Гипотоник", "Гипертоник", "Бүлэг"], "c": 0, "e": "ИЗОТОНИК уусмал нь эсийн шүүстэй тэнцүү концентрацитай тул ус орох гарах нь тэнцүү, эс хэвээрээ байна. Жишээ нь 0,9 % давсны уусмал (физиологийн уусмал)."}, {"id": "3.13", "q": "Энзимийг бүтээх биологийн молекулыг юу гэдэг вэ?", "o": ["Уураг", "Тос", "Нүүрс ус", "Витамин"], "c": 0, "e": "Энзим (фермент) бараг бүгдээрээ УУРАГ. Энэ нь амин хүчлийн гинжээс тогтдог тул температур, рН-д мэдрэмтгий."}, {"id": "3.14", "q": "Энзимийн бүтэц эвдрэхийг юу гэдэг вэ?", "o": ["Плазмолиз", "Денатураци", "Хуваагдал", "Осмос"], "c": 1, "e": "Өндөр температур, хүчил, шүлт зэргийн нөлөөгөөр уургийн бүтэц эвдрэхийг ДЕНАТУРАЦИ гэнэ. Эвдэрсэн энзим ажиллахаа больдог (өндөг чанахад цагаан нь хатуурна)."}, {"id": "3.15", "q": "Энзимийн хонхорхойг юу гэж нэрлэдэг вэ?", "o": ["Цөм", "Мембран", "Рибосом", "Идэвхтэй төв"], "c": 3, "e": "Энзимийн гадаргуу дээрх тусгай хэлбэртэй хонхор нь ИДЭВХТЭЙ ТӨВ. Субстрат тэнд яг тохирч холбогдоно (түлхүүр–цоожны загвар)."}, {"id": "3.16", "q": "Энзимийн идэвхтэй төвтэй холбогддог бодисыг нэрлэ", "o": ["Субстрат", "Хүчил", "Нуклейн хүчил", "Катализатор"], "c": 0, "e": "Энзимийн идэвхтэй төвтэй холбогдож урвалд орох бодис нь СУБСТРАТ (жишээ: амилазын субстрат нь цардуул)."}, {"id": "3.17", "q": "Энзим ажиллах тохиромжтой температурыг юу гэдэг вэ?", "o": ["Оновчтой (оптимум) температур", "Буцлах температур", "Хамгийн бага температур", "Денатурацийн температур"], "c": 0, "e": "Энзим хамгийн идэвхтэй ажиллах температурыг ОНОВЧТОЙ (оптимум) температур гэнэ. Үүнээс хүйтэн бол удаан, хэт халуун бол денатураци болно."}, {"id": "3.18", "q": "Хүний энзимийн ажиллах тохиромжтой температур хэд вэ?", "o": ["Ойролцоогоор 37 °C", "Ойролцоогоор 10 °C", "Ойролцоогоор 100 °C", "Ойролцоогоор 60 °C"], "c": 0, "e": "Хүний биеийн энзимүүд бие махбодийн температур буюу ойролцоогоор 36–37 °C-д хамгийн сайн ажилладаг."}, {"id": "3.19", "q": "Ходоодонд байх энзимийг нэрлэ", "o": ["Липаз", "Пепсин", "Каталаз", "Амилаз"], "c": 1, "e": "Ходоодны шүүсэнд ПЕПСИН уураг задалдаг. Амилаз нь цардуул (шүлс, нойр булчирхай), липаз нь тос задалдаг."}, {"id": "3.20", "q": "Энзим ямар үүрэгтэй вэ?", "o": ["Эсийг хамгаалах бүрхүүл болно", "Амьд биед явагдах химийн урвалыг хурдасгана", "Хүчилтөрөгч зөөнө", "Эрчим хүч хадгалах тос болно"], "c": 1, "e": "Энзим нь биологийн КАТАЛИЗАТОР. Өөрөө үрэгдэхгүйгээр амьд биед явагдах химийн урвалыг олон дахин хурдасгадаг."}], "ge": [{"id": "4.2", "q": "Дэлхий гарагийн Нарнаас алслагдсан зай хэдэн км вэ?", "o": ["Ойролцоогоор 384 мянган км", "Ойролцоогоор 150 сая км", "Ойролцоогоор 1,5 тэрбум км", "Ойролцоогоор 15 сая км"], "c": 1, "e": "Дэлхий Нарнаас дунджаар ~149,6 сая function betPlay(rid){
  var r=S.bet.filter(function(x){return x.id===rid;})[0]; if(!r||!r.log) return;
  if(S.betTimer) clearInterval(S.betTimer);
  S.betRep={rid:rid}; render(true);
  var ev=r.log.ev, pos=r.log.players.map(function(){return 0;}), i=0, nm=r.log.players;
  S.betTimer=setInterval(function(){
    if(S.tab!=="bet"||i>=ev.length){ clearInterval(S.betTimer); S.betTimer=null; var l=$("betlast"); if(l&&i>=ev.length) l.textContent="🏁 Дууслаа"; return; }
    var e=ev[i++]; pos[e.p-1]=e.x; if(e.k) pos[e.k-1]=0;
    Array.prototype.forEach.call(document.querySelectorAll(".brp"),function(b){ b.style.width=Math.min(100,pos[Number(b.getAttribute("data-i"))]/40*100)+"%"; });
    var l=$("betlast"); if(l) l.textContent="🎲 "+nm[e.p-1]+": "+e.r+(e.k?" · "+nm[e.k-1]+"-г идлээ!":"");
  },260);
}

    var d=$("d_start").value; if(!d){ toast("Өдөр сонгоно уу"); return; }
    var r=await rpcDo("admin_set_duty_start",{p_code:S.code,p_day:d},"Хадгаллаа ✔"); if(r){ await loadAll(); render(true); }
  };
}

if("serviceWorker" in navigator){ window.addEventListener("load",function(){ navigator.serviceWorker.register("sw2.js").catch(function(){}); });
  navigator.serviceWorker.addEventListener("message",function(e){ if(e.data&&e.data.tab&&S.user){ S.tab=e.data.tab; render(); } }); }

function showSplash(){
  try{ if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches) return; }catch(e){}
  var d=document.createElement("div"); d.id="splash";
  var pc=["#22d3ee","#8b5cf6","#ff6fa5","#7dd3fc","#c4b5fd"], ps="", i;
  for(i=0;i<34;i++){ var a=i*137.5*Math.PI/180, r=160+(i%5)*40; ps+='<i class="sp-p" style="--px:'+Math.round(Math.cos(a)*r)+'px;--py:'+Math.round(Math.sin(a)*r*1.3)+'px;--pd:'+((i%9)*0.07).toFixed(2)+'s;--pc:'+pc[i%5]+'"></i>'; }
  d.innerHTML='<div class="sp-grid"></div>'+ps+'<div class="sp-rings"><i></i><i></i><i></i></div>'+
   '<svg class="sp-logo" viewBox="0 0 300 120"><defs><linearGradient id="spg" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ff6fa5"/></linearGradient></defs>'+
   '<text class="sp-fill" x="150" y="92" text-anchor="middle" font-size="100" font-weight="900" font-style="italic" font-family="system-ui,sans-serif" fill="url(#spg)">10B</text>'+
   '<text class="sp-st" x="150" y="92" text-anchor="middle" font-size="100" font-weight="900" font-style="italic" font-family="system-ui,sans-serif" fill="none" stroke="#fff" stroke-width="2.4">10B</text></svg>'+
   '<div class="sp-w">WELCOME TO</div><div class="sp-t">10B WORLD</div><button class="sp-skip">Алгасах ›</button><div class="sp-bar"><i></i></div>';
  document.body.appendChild(d);
  function end(){ if(!d.parentNode) return; d.classList.add("out"); setTimeout(function(){ if(d.parentNode) d.remove(); },480); }
  d.querySelector(".sp-skip").onclick=end; d.onclick=end; setTimeout(end,2800);
}
showSplash();
(async function init(){
  var c=lsGet("code10b");
  if(!c){ showLogin(); return; }
  var r=await sb.rpc("login",{p_code:c});
  if(r.error||!r.data||!r.data.length){ showLogin(); return; }
  S.user=r.data[0]; S.code=c; start();
})();
</script>
