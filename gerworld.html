<!doctype html>
<html lang="mn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>GER WORLD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0e1418;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;z-index:5;pointer-events:none}
.glass{background:rgba(14,20,24,.55);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:10px}
#top{left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));padding:7px 11px;font-size:12px;line-height:1.35;letter-spacing:.02em}
#top b{display:block;font-size:13px;letter-spacing:.14em;font-weight:600}
#top span{opacity:.75}
#right{right:max(12px,env(safe-area-inset-right));top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.btn{pointer-events:auto;display:flex;align-items:center;gap:7px;padding:9px 12px;font-size:12.5px;color:#fff;cursor:pointer;min-height:40px}
.btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn:active{background:rgba(255,255,255,.22)}
#mini{width:128px;height:128px;border-radius:10px;overflow:hidden;pointer-events:auto;position:relative}
#mini canvas{width:100%;height:100%;display:block}
#joy{left:max(24px,env(safe-area-inset-left));bottom:max(26px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;pointer-events:none;background:rgba(14,20,24,.38);border:1px solid rgba(255,255,255,.18)}
#joy i{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.5)}
#acts{right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
#hint{left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);padding:7px 14px;font-size:12.5px;opacity:0;transition:opacity .4s;text-align:center;white-space:nowrap}
#panel{position:fixed;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px;display:none;min-width:260px;max-width:92vw}
#panel h4{margin:0 0 4px;font-size:13px;letter-spacing:.08em;font-weight:600}
#panel p{margin:0 0 12px;font-size:12px;opacity:.7}
#panel .row{display:flex;gap:8px;flex-wrap:wrap}
#panel .chip{flex:1;min-width:56px;text-align:center;padding:12px 6px;border-radius:9px;border:1px solid rgba(255,255,255,.22);font-size:14px;cursor:pointer;background:rgba(255,255,255,.06)}
#panel .chip small{display:block;font-size:10.5px;opacity:.65;margin-top:2px}
#panel .chip.on{background:#e9e2d0;color:#0e1418;border-color:#e9e2d0}
#panel .x{margin-top:12px;text-align:center;font-size:12.5px;opacity:.75;cursor:pointer;padding:6px}
#bigmap{position:fixed;inset:0;z-index:9;display:none;background:rgba(8,12,15,.82);align-items:center;justify-content:center}
#bigmap canvas{width:min(92vw,86vh);height:min(92vw,86vh);border-radius:10px;border:1px solid rgba(255,255,255,.2)}
#start{position:fixed;inset:0;z-index:20;background:linear-gradient(180deg,#0e1418,#1c2a30);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px}
#start h1{margin:0;font-weight:600;letter-spacing:.32em;font-size:26px}

#start button{margin-top:8px;padding:13px 34px;font-size:14px;letter-spacing:.12em;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
#start button:disabled{opacity:.45}
.bar{width:180px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#e9e2d0;transition:width .25s}
</style></head><body>
<canvas id="gl"></canvas>
<div id="top" class="hud glass"><b>GER WORLD</b><span id="tinfo">—</span></div>
<div id="right" class="hud">
  <div id="mini" class="glass"><canvas id="mm" width="256" height="256"></canvas></div>
  <div class="btn glass" id="bcam"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.6-4 3-6 6.5-6s5.900 2 6.500 6"/></svg><span id="bcamt">3-р этгээд</span></div>
  <div class="btn glass" id="bger"><svg viewBox="0 0 24 24"><path d="M3 18h18M5 18v-4h14v4M4 14c1.500-4 4.500-6.500 8-6.500s6.500 2.500 8 6.500"/><path d="M12 7.500V5"/></svg><span>Гэр</span></div>
</div>
<div id="joy" class="hud"><i></i></div>
<div id="acts" class="hud">
  <div class="btn glass" id="brun"><svg viewBox="0 0 24 24"><path d="M13 4l-1 6 4 2-5 8"/><circle cx="15" cy="4" r="1"/></svg><span id="brunt">Алхах</span></div>
</div>
<div id="hint" class="hud glass"></div>
<div id="panel" class="glass">
  <h4>МОНГОЛ ГЭР</h4><p>Ханын тоо. Их ханатай гэр том, өргөн.</p>
  <div class="row" id="chips"></div>
  <div class="x" id="pclose">Хаах</div>
</div>
<div id="bigmap"><canvas id="bm" width="640" height="640"></canvas></div>
<div id="start"><h1>GER WORLD</h1><p>Монгол хөндий, гол, толгод, гэр. Зүүн гараар явна, баруун гараар эргэж харна. Гэрийн хаалганд ойртвол хаалга нээгдэнэ.</p><div class="bar"><i id="bari"></i></div><button id="go" disabled>Ачаалж байна…</button></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
"use strict";
var T=THREE;
/* ================= туслах ================= */
function sstep(a,b,x){ var t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); }
function mix(a,b,t){ return a+(b-a)*t; }
function hash(x,y){ var n=Math.sin(x*127.1+y*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,y){ var xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; var u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return mix(mix(hash(xi,yi),hash(xi+1,yi),u),mix(hash(xi,yi+1),hash(xi+1,yi+1),u),v); }
function fbm(x,y){ return vnoise(x,y)*.5+vnoise(x*2.1,y*2.1)*.25+vnoise(x*4.3,y*4.3)*.125+vnoise(x*8.7,y*8.7)*.0625; }
var seed=12345; function rnd(){ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; }
function tex(w,h,draw,rep){ var c=document.createElement("canvas"); c.width=w; c.height=h; var g=c.getContext("2d"); draw(g,w,h);
  var t=new T.CanvasTexture(c); t.colorSpace=T.SRGBColorSpace; t.anisotropy=4; if(rep){ t.wrapS=t.wrapT=T.RepeatWrapping; t.repeat.set(rep[0],rep[1]); } return t; }
function merge(geos){ var pos=[],nor=[],col=[]; geos.forEach(function(g){ g=g.index?g.toNonIndexed():g; var p=g.attributes.position.array,n=g.attributes.normal.array,c=g.attributes.color?g.attributes.color.array:null;
  for(var i=0;i<p.length;i++){ pos.push(p[i]); nor.push(n[i]); } if(c) for(i=0;i<c.length;i++) col.push(c[i]); });
  var r=new T.BufferGeometry(); r.setAttribute("position",new T.Float32BufferAttribute(pos,3)); r.setAttribute("normal",new T.Float32BufferAttribute(nor,3)); if(col.length) r.setAttribute("color",new T.Float32BufferAttribute(col,3)); return r; }
function paint(g,hex){ var c=new T.Color(hex), n=g.attributes.position.count, a=new Float32Array(n*3); for(var i=0;i<n;i++){ a[i*3]=c.r; a[i*3+1]=c.g; a[i*3+2]=c.b; } g.setAttribute("color",new T.BufferAttribute(a,3)); return g; }

/* ================= дэлхийн загвар ================= */
var GER={x:-38,z:-30}, FLAT_H=1.0;
function riverZ(x){ return 26+16*Math.sin(x*.02+.5)+5*Math.sin(x*.055); }
function H(x,z){
  var dist=Math.sqrt(x*x+z*z), dr=Math.abs(z-riverZ(x));
  var hills=fbm(x*.012+3,z*.012+7)*16+fbm(x*.045,z*.045)*2.4;
  hills*=sstep(6,55,dr);
  var m=sstep(135,270,dist);
  var h=hills+m*m*(70+90*fbm(x*.009+9,z*.009+4))*(.6+.6*fbm(x*.02,z*.02));
  h-=1.7*sstep(10,0,dr);
  var gd=Math.sqrt((x-GER.x)*(x-GER.x)+(z-GER.z)*(z-GER.z));
  h=mix(h,FLAT_H,sstep(30,15,gd));
  return h;
}
var WATER_Y=-.38;
var wind={speed:3,dx:1,dz:.3,gust:0};
var U={uTime:{value:0},uWind:{value:3},uDir:{value:new T.Vector2(.95,.3)}};
function windify(mat,k,refY){
  mat.onBeforeCompile=function(sh){
    sh.uniforms.uTime=U.uTime; sh.uniforms.uWind=U.uWind; sh.uniforms.uDir=U.uDir;
    sh.vertexShader="uniform float uTime;uniform float uWind;uniform vec2 uDir;\n"+sh.vertexShader.replace("#include <project_vertex>",
    "vec4 mvPosition=vec4(transformed,1.0);\n#ifdef USE_INSTANCING\nmvPosition=instanceMatrix*mvPosition;\n#endif\n"+
    "float hh=max(position.y,0.0)/"+(refY||1).toFixed(2)+";\nvec3 wp=(modelMatrix*mvPosition).xyz;\n"+
    "float w=sin(uTime*1.7+wp.x*.25+wp.z*.18)*.5+.5; w+=sin(uTime*.55+wp.x*.06+wp.z*.04)*.6+.4;\n"+
    "mvPosition.xz+=uDir*(w*uWind*"+k.toFixed(3)+")*hh*hh;\nmvPosition=modelViewMatrix*mvPosition;\ngl_Position=projectionMatrix*mvPosition;");
  };
  return mat;
}

/* ================= renderer / сцен ================= */
var cv=document.getElementById("gl");
var mobile=/Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)||("ontouchstart" in window);
var renderer=new T.WebGLRenderer({canvas:cv,antialias:!mobile,powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,mobile?1.5:2));
renderer.outputColorSpace=T.SRGBColorSpace;
renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=.9;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap;
var scene=new T.Scene();
var FOG=0xe6d3b3; scene.fog=new T.Fog(FOG,90,560); scene.background=new T.Color(FOG);
var camera=new T.PerspectiveCamera(65,1,.08,1800); camera.rotation.order="YXZ";
var sunDir=new T.Vector3(-.55,.42,-.62).normalize();
var sun=new T.DirectionalLight(0xffd7a0,2.3); sun.castShadow=true;
sun.shadow.mapSize.set(mobile?1024:2048,mobile?1024:2048);
var sc=sun.shadow.camera; sc.left=-34; sc.right=34; sc.top=34; sc.bottom=-34; sc.near=1; sc.far=220; sun.shadow.bias=-.0006; sun.shadow.normalBias=.04;
scene.add(sun); scene.add(sun.target);
scene.add(new T.HemisphereLight(0xbfd4ee,0x8a7a52,.85));
function onResize(){ var w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
addEventListener("resize",onResize); onResize();

/* --- аспан --- */
(function(){
  var g=new T.SphereGeometry(1200,32,16);
  var m=new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:{sd:{value:sunDir}},
   vertexShader:"varying vec3 v;void main(){v=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}",
   fragmentShader:"varying vec3 v;uniform vec3 sd;void main(){float h=clamp(v.y,0.0,1.0);vec3 hor=vec3(.93,.84,.69);vec3 mid=vec3(.62,.75,.89);vec3 top=vec3(.33,.52,.82);"+
   "vec3 c=mix(hor,mid,smoothstep(0.0,.22,h));c=mix(c,top,smoothstep(.2,.9,h));float s=max(dot(normalize(v),sd),0.0);c+=vec3(1.0,.78,.45)*pow(s,6.0)*.45+vec3(1.0,.9,.7)*pow(s,260.0)*2.0;gl_FragColor=vec4(c,1.0);}"});
  scene.add(new T.Mesh(g,m));
})();
var clouds=[]; (function(){
  var t=tex(128,128,function(g,w,h){ var r=g.createRadialGradient(64,64,4,64,64,62); r.addColorStop(0,"rgba(255,255,255,.95)"); r.addColorStop(.55,"rgba(255,248,235,.45)"); r.addColorStop(1,"rgba(255,248,235,0)"); g.fillStyle=r; g.fillRect(0,0,w,h); });
  for(var i=0;i<26;i++){ var s=new T.Sprite(new T.SpriteMaterial({map:t,transparent:true,opacity:.55+rnd()*.3,fog:false,depthWrite:false}));
    var a=rnd()*6.28, d=300+rnd()*600; s.position.set(Math.cos(a)*d,130+rnd()*120,Math.sin(a)*d); var k=120+rnd()*220; s.scale.set(k*1.8,k*.5,1); scene.add(s); clouds.push(s); }
})();

/* ================= газар ================= */
var terrain;
(function(){
  var SIZE=760, SEG=mobile?200:260, geo=new T.PlaneGeometry(SIZE,SIZE,SEG,SEG); geo.rotateX(-Math.PI/2);
  var p=geo.attributes.position; for(var i=0;i<p.count;i++){ p.setY(i,H(p.getX(i),p.getZ(i))); }
  geo.computeVertexNormals();
  var nor=geo.attributes.normal, col=new Float32Array(p.count*3), c=new T.Color();
  for(i=0;i<p.count;i++){
    var x=p.getX(i), y=p.getY(i), z=p.getZ(i), slope=1-nor.getY(i), dr=Math.abs(z-riverZ(x)), n=fbm(x*.08,z*.08), n2=vnoise(x*.6,z*.6);
    c.set(0x9a8c50).lerp(new T.Color(0xaf9c58),n); c.lerp(new T.Color(0x7a7040),n2*.6); c.lerp(new T.Color(0x6f7c3d),sstep(.45,.75,fbm(x*.03+40,z*.03)) *.55);
    var gr=sstep(22,4,dr)*sstep(3,.2,y); c.lerp(new T.Color(0x8da24f),gr*.8);
    c.lerp(new T.Color(0x8a7f6c),sstep(.12,.38,slope));
    c.lerp(new T.Color(0x8f8c88),sstep(30,70,y)); c.lerp(new T.Color(0xf4f6fa),sstep(78,104,y+slope*26));
    if(y<-.3) c.lerp(new T.Color(0x6b6a4e),.6);
    col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  geo.setAttribute("color",new T.BufferAttribute(col,3));
  var dt=tex(256,256,function(g,w,h){ g.fillStyle="#fff"; g.fillRect(0,0,w,h); for(var i=0;i<2600;i++){ g.fillStyle="rgba("+(120+rnd()*100|0)+","+(110+rnd()*90|0)+",70,"+(.05+rnd()*.12)+")"; g.fillRect(rnd()*w,rnd()*h,1+rnd()*2,1+rnd()*5); } },[190,190]);
  terrain=new T.Mesh(geo,new T.MeshLambertMaterial({vertexColors:true,map:dt}));
  terrain.receiveShadow=true; scene.add(terrain);
  // ус
  var wn=tex(256,256,function(g,w,h){ g.fillStyle="#8080ff"; g.fillRect(0,0,w,h); for(var i=0;i<500;i++){ g.strokeStyle="rgba("+(100+rnd()*60|0)+","+(100+rnd()*60|0)+",255,.35)"; g.lineWidth=1+rnd()*2; g.beginPath(); var x=rnd()*w,y=rnd()*h; g.moveTo(x,y); g.quadraticCurveTo(x+rnd()*20-10,y+rnd()*8,x+rnd()*40-20,y+rnd()*10-5); g.stroke(); } },[60,60]);
  wn.colorSpace=T.NoColorSpace;
  window.waterTex=wn;
  var wm=new T.Mesh(new T.PlaneGeometry(SIZE,SIZE).rotateX(-Math.PI/2),new T.MeshStandardMaterial({color:0x5d7f8e,transparent:true,opacity:.84,roughness:.08,metalness:.15,normalMap:wn,normalScale:new T.Vector2(.5,.5)}));
  wm.position.y=WATER_Y; scene.add(wm); window.water=wm;
})();

/* --- өвс (салхинд хэлбийнэ) --- */
(function(){
  var n=mobile?15000:26000, pos=[], col=[], B=7;
  for(var k=0;k<B;k++){ var a=rnd()*6.28, rr=Math.sqrt(rnd())*.3, bx=Math.cos(a)*rr, bz=Math.sin(a)*rr, hgt=.28+rnd()*.38, w=.022+rnd()*.012, ya=rnd()*3.14, lean=.05+rnd()*.12, cx=Math.cos(ya), sz=Math.sin(ya), dxl=Math.cos(a+1.2)*lean, dzl=Math.sin(a+1.2)*lean;
    pos.push(bx-cx*w,0,bz-sz*w, bx+cx*w,0,bz+sz*w, bx+dxl,hgt,bz+dzl);
    var tone=.8+rnd()*.35; col.push(.26*tone,.24*tone,.1*tone, .26*tone,.24*tone,.1*tone, .8*tone,.7*tone,.36*tone); }
  var g=new T.BufferGeometry(); g.setAttribute("position",new T.Float32BufferAttribute(pos,3)); g.setAttribute("color",new T.Float32BufferAttribute(col,3)); g.computeVertexNormals();
  var m=windify(new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide}),.18,.6);
  var im=new T.InstancedMesh(g,m,n), d=new T.Object3D(), k2=0;
  for(var i=0;i<n*4&&k2<n;i++){
    var x=GER.x+(rnd()-.5)*220, z=GER.z+(rnd()-.5)*220, y=H(x,z), dr=Math.abs(z-riverZ(x));
    if(y<.05||y>26||dr<5) continue; var gd=Math.hypot(x-GER.x,z-GER.z); if(gd<6.4) continue;
    var gx=x-GER.x, gz=z-GER.z; if(Math.abs(gx)<1.2&&gz>0&&gz<14) continue;
    var s=.75+rnd()*.9; d.position.set(x,y,z); d.rotation.set(0,rnd()*6.28,0); d.scale.set(s,s,s); d.updateMatrix(); im.setMatrixAt(k2++,d.matrix); }
  im.count=k2; im.frustumCulled=false; scene.add(im);
})();

/* --- нарс --- */
(function(){
  var parts=[], tr=new T.CylinderGeometry(.18,.3,3.2,6); tr.translate(0,1.6,0); parts.push(paint(tr,0x4a3524));
  var cols=[0x3d5c36,0x436537,0x37562f,0x48693b];
  for(var i=0;i<5;i++){ var cn=new T.ConeGeometry(2.2-i*.36,2.5-i*.12,7); cn.translate(0,3.2+i*1.35+1.2,0); parts.push(paint(cn,cols[i%4])); }
  var g=merge(parts), m=windify(new T.MeshLambertMaterial({vertexColors:true}),.02,10);
  var pts=[]; for(var c=0;c<6;c++){ var cx,cz; do{ var a=rnd()*6.28, r=60+rnd()*90; cx=Math.cos(a)*r; cz=Math.sin(a)*r; }while(Math.abs(cz-riverZ(cx))<25||H(cx,cz)>38);
    var cnt=10+(rnd()*14|0); for(var j=0;j<cnt;j++){ var x=cx+(rnd()-.5)*36,z=cz+(rnd()-.5)*36; if(Math.abs(z-riverZ(x))<12||H(x,z)>48||Math.hypot(x-GER.x,z-GER.z)<22) continue; pts.push([x,z]); } }
  // гэрийн баруун талд жижиг ой
  for(j=0;j<16;j++){ x=GER.x-34+rnd()*26; z=GER.z-26+rnd()*28; pts.push([x,z]); }
  var im=new T.InstancedMesh(g,m,pts.length), d=new T.Object3D(); im.castShadow=true; im.receiveShadow=true;
  pts.forEach(function(q,i){ var s=.55+rnd()*.55; d.position.set(q[0],H(q[0],q[1])-.15,q[1]); d.rotation.set(0,rnd()*6.28,0); d.scale.set(s,s*(.9+rnd()*.3),s); d.updateMatrix(); im.setMatrixAt(i,d.matrix); });
  im.frustumCulled=false; scene.add(im);
})();

/* --- чулуу (шар хаг) --- */
(function(){
  var g=new T.IcosahedronGeometry(1,3), p=g.attributes.position, col=new Float32Array(p.count*3), v=new T.Vector3(), c=new T.Color();
  for(var i=0;i<p.count;i++){ v.fromBufferAttribute(p,i); var n=fbm(v.x*1.6+5,v.y*1.6+v.z*1.6)*.6+.7; v.multiplyScalar(n*.82); if(v.y<-.35) v.y=-.35; p.setXYZ(i,v.x,v.y,v.z);
    var lich=vnoise(v.x*4.2+3,v.z*4.2+v.y*3.1); c.set(0x8d877c).lerp(new T.Color(0x6f6a62),vnoise(v.x*9,v.z*9));
    if(lich>.56&&v.y>-.05) c.lerp(new T.Color(0xe2b422),sstep(.56,.68,lich)); col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b; }
  g.setAttribute("color",new T.BufferAttribute(col,3)); g.computeVertexNormals();
  var N=46, im=new T.InstancedMesh(g,new T.MeshLambertMaterial({vertexColors:true}),N), d=new T.Object3D(), k=0;
  for(var q=0;q<400&&k<N;q++){ var x=(rnd()-.5)*320,z=(rnd()-.5)*320, y=H(x,z); if(y<.1||Math.hypot(x-GER.x,z-GER.z)<10) continue; if(Math.abs(z-riverZ(x))<5&&rnd()<.4) continue;

  // зөв чиглэлд: зүүн навч +, баруун навч -

  horses.forEach(function(h){ var u2=h.g.userData; var gz=Math.max(0,Math.sin(t*.35+h.ph)); u2.neck.rotation.z=-gz*.9; u2.tail.rotation.z=Math.sin(t*2+h.ph)*.2*(U.uWind.value*.25); u2.tail.rotation.x=Math.sin(t*1.3+h.ph)*.1; });
  clouds.forEach(function(c,i){ c.position.x+=U.uDir.value.x*dt*(1.2+i%4*.3); c.position.z+=U.uDir.value.y*dt*(1.2+i%4*.3); if(c.position.x>900) c.position.x=-900; if(c.position.z>900) c.position.z=-900; });
  window.waterTex.offset.x=t*.012; window.waterTex.offset.y=t*.007;
  updateCloth(t); updateSmoke(dt);
  if(audio) { audio.gn.gain.value=Math.min(.3,.02+U.uWind.value*.028)*(inside(ger)?.35:1); audio.f.frequency.value=260+U.uWind.value*70; }
  renderer.render(scene,camera);
  tAcc+=dt; if(tAcc>.2){ tAcc=0; var dirs=["Хойд","Зүүн хойд","Зүүн","Зүүн урд","Урд","Баруун урд","Баруун","Баруун хойд"]; var wa=Math.atan2(U.uDir.value.y,U.uDir.value.x); var ci=Math.round(((wa*180/Math.PI+360+90)%360)/45)%8;
    tinfo.innerHTML="Салхи <span style='opacity:1'>"+U.uWind.value.toFixed(1)+" м/с</span> · "+(inside(ger)?"Гэр дотор":"Хөндий"); drawMap(mm,false); }
}
